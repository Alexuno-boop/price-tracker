# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
services:
  - type: web
    name: price-history-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 150 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL      # paste your Neon connection string when Render asks
        sync: false
      - key: CRON_SECRET       # random value; copy it into the GitHub secret of the same name
        generateValue: true
